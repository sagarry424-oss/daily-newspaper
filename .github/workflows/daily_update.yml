name: Daily Newspaper Update

on:
  schedule:
    # Runs daily at 2:00 AM UTC (which is 7:30 AM IST)
    - cron: '0 2 * * *' 
  workflow_dispatch: # This line allows you to trigger it manually anytime!

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Newspaper Script
        run: python build_newspaper.py

      - name: Commit and Push Output
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          # This ignores errors if the news hasn't changed since last run
          git commit -m "Automated daily newspaper update" || exit 0
          git push
